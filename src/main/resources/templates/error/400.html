<!--/* Shown for HTTP 400: a bad request, e.g. an unknown status filter. Spring Boot picks templates/error/<status>.html automatically. No error details are shown to users. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bad request')}"></head>
<body class="centered">
<main class="card narrow">
    <h1>Bad request</h1>
    <p>That request wasn't valid. Check the link and try again.</p>
    <a class="button" th:href="@{/}">Go back</a>
</main>
</body>
</html>
