<!--/* Shown for HTTP 500: an unexpected server error. Spring Boot picks templates/error/<status>.html automatically. No error details are shown to users. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body class="centered">
<main class="card narrow">
    <h1>Something went wrong</h1>
    <p>We couldn't complete that request. Try again in a moment. If it keeps happening, contact support.</p>
    <a class="button" th:href="@{/}">Go back</a>
</main>
</body>
</html>
