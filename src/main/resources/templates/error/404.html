<!--/* Shown for HTTP 404: not found, including records that belong to someone else. Spring Boot picks templates/error/<status>.html automatically. No error details are shown to users. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page not found')}"></head>
<body class="centered">
<main class="card narrow">
    <h1>Page not found</h1>
    <p>We couldn't find what you were looking for. It may have moved, or it may not belong to your account.</p>
    <a class="button" th:href="@{/}">Go back</a>
</main>
</body>
</html>
