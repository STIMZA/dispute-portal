<!--/* Sign-in page for customers and admins. The form is handled by Spring Security (POST /login); see SecurityConfig. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="centered">
<main class="card narrow">
    <h1>Sign in</h1>
    <p class="notice notice-bad" role="alert" th:if="${param.error}">That username or password is incorrect.</p>
    <p class="notice notice-bad" role="alert" th:if="${param.locked}">Too many failed attempts. Please wait a few minutes before trying again.</p>
    <p class="notice notice-ok" role="status" th:if="${param.logout}">You have been signed out.</p>
    <!--/* Field names 'username' and 'password' are what Spring Security's form login expects. th:action adds the CSRF token. */-->
    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="button">Sign in</button>
    </form>
</main>
</body>
</html>
