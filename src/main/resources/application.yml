spring:
  # How long to wait for in-flight requests to finish when the app is stopped (see server.shutdown).
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: dispute-portal
  # Profile used when none is chosen. The Docker image sets SPRING_PROFILES_ACTIVE=prod instead.
  profiles:
    default: dev
  # Default database: in-memory H2 (lost on restart). The prod profile switches to PostgreSQL (application-prod.yml).
  datasource:
    url: jdbc:h2:mem:disputes;DB_CLOSE_DELAY=-1
  jpa:
    # Don't keep a database session open while a page is rendered. The services load everything a page needs, so
    # templates never trigger hidden lazy-loading queries.
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (db/migration)
    properties:
      hibernate:
        jdbc:
          # Read and write timestamps in GMT.
          time_zone: GMT
  # Flyway applies the SQL files in db/migration at startup.
  flyway:
    enabled: true

server:
  # Finish in-flight requests before stopping.
  shutdown: graceful
  servlet:
    session:
      cookie:
        # Session cookie: hidden from JavaScript (http-only) and not sent on cross-site POSTs (same-site: lax).
        # The 'secure' flag is added in the prod profile.
        http-only: true
        same-site: lax
  # Never show stack traces or exception messages on error pages or responses.
  error:
    include-stacktrace: never
    include-message: never

app:
  # How many days after a transaction it can still be disputed.
  dispute:
    window-days: 120
  # Evidence uploads. The multipart size limits are derived from max-file-bytes (see UploadConfig).
  evidence:
    # Where files are written. Dev/test default to the temp folder; the prod profile uses /data/evidence (a Docker volume).
    storage-dir: ${EVIDENCE_DIR:${java.io.tmpdir}/dispute-portal-evidence}
    max-file-bytes: 5242880
    max-files-per-dispute: 5

logging:
  # Adds the per-request correlation id to every log line (see CorrelationIdFilter).
  pattern:
    level: "%5p [%X{correlationId:-}]"

# Actuator: only the health endpoint is exposed, for Docker/Kubernetes health checks.
management:
  endpoints:
    web:
      exposure:
        include: health   # nothing else is exposed
  endpoint:
    health:
      probes:
        enabled: true     # /actuator/health/liveness and /actuator/health/readiness
      show-details: never
